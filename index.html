<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>RAPIDPLUS Firmware Update</title>
  <link rel="stylesheet" href="assets/style.css">
  <link rel="icon" type="image/png" href="assets/logo.png">
</head>

<body>
  <header class="header">
    <img src="assets/logo.png" class="logo" alt="RAPIDPLUS logo" />
    <div class="title-area">
      <h1>RAPIDPLUS Firmware Update</h1>
      <p>Reliable · Web-Serial · ESP32 Flashing</p>
    </div>
  </header>

  <main class="container">

    <!-- STEP 1 -->
    <section class="card">
      <h2>Step 1 — Select Firmware</h2>

      <select id="versionSelect" class="select-box">
        <option value="">Loading…</option>
      </select>

      <button id="loadVersionBtn" class="btn primary" disabled>Load Firmware</button>
      <div id="versionInfo" class="info-box"></div>
    </section>

    <!-- STEP 2 -->
    <section class="card">
      <h2>Step 2 — Connect Device</h2>
      <button id="connectBtn" class="btn outline">Connect RAPIDPLUS</button>
      <div id="portStatus" class="info-box muted">Not connected</div>
    </section>

    <!-- STEP 3 -->
    <section class="card">
      <h2>Step 3 — Flash Firmware</h2>
      <button id="flashBtn" class="btn primary" disabled>Flash Now</button>

      <div class="progress-area">
        <label>Progress</label>
        <div id="progressBar"><span></span></div>

        <div class="progress-info">
          <span id="pct">0%</span>
          <span id="speed">0 KB/s</span>
          <span id="eta">ETA --:--</span>
        </div>
      </div>

      <div id="flashStatus" class="info-box muted">Waiting…</div>
    </section>

  </main>

  <footer class="footer">© 2025 RAPIDPLUS Firmware System</footer>

  <!-- MUST BE LOADED FIRST -->
  <script src="assets/esptool.min.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
